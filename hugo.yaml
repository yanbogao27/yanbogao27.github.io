baseURL: "https://yanbogao27.github.io/"
locale: "zh-CN"
title: "高研博的技术博客"
theme: ["PaperMod"]

enableRobotsTXT: true

pagination:
  pagerSize: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
        enable: true

params:
  env: production
  description: "分享模拟集成电路、电源管理、PLL、EDA 工具及论文阅读中的学习与思考。"
  defaultTheme: auto
  math: false

  ShowToc: true
  TocOpen: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowReadingTime: true

  homeInfoParams:
    Title: "高研博的技术博客"
    Content: "记录模拟集成电路、电源管理、PLL、EDA 工具及论文阅读中的学习与思考。"

  socialIcons:
    - name: github
      url: "https://github.com/yanbogao27"

menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10

    - identifier: categories
      name: 分类
      url: /categories/
      weight: 20

    - identifier: tags
      name: 标签
      url: /tags/
      weight: 30

    - identifier: archives
      name: 归档
      url: /archives/
      weight: 40

    - identifier: search
      name: 搜索
      url: /search/
      weight: 50

    - identifier: about
      name: 关于
      url: /about/
      weight: 60